name: Android Instrumented Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  instrumented-tests:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4
      - name: Firebase Android configuration
        env:
          QUEDA_FIREBASE_JSON_BASE64: ${{ secrets.QUEDA_FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$QUEDA_FIREBASE_JSON_BASE64" ]; then
            printf '%s' "$QUEDA_FIREBASE_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"demo-queda","storage_bucket":"demo-queda.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.luisete.queda"}},"api_key":[{"current_key":"AIzaSyDemoKey"}]}]}' > app/google-services.json
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Grant execute permissions
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./scripts/run-instrumented-ci.sh

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            build/ci-diagnostics/**
          if-no-files-found: warn
