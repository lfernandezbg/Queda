name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firebase Android configuration
        env:
          QUEDA_FIREBASE_JSON_BASE64: ${{ secrets.QUEDA_FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$QUEDA_FIREBASE_JSON_BASE64" ]; then
            printf '%s' "$QUEDA_FIREBASE_JSON_BASE64" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"demo-queda","storage_bucket":"demo-queda.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.luisete.queda"}},"api_key":[{"current_key":"AIzaSyDemoKey"}]}]}' > app/google-services.json
          fi
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Grant execute permission
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Clean
        run: ./gradlew clean

      - name: Test
        run: ./gradlew test

      - name: Architecture Test
        run: ./gradlew :quality:architecture:testDebugUnitTest

      - name: Lint
        run: ./gradlew lint

      - name: Detekt
        run: ./gradlew detekt

      - name: Ktlint
        run: ./gradlew ktlintCheck

      - name: Jacoco Report
        run: ./gradlew jacocoTestReport

      - name: Jacoco Verification
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build Debug
        run: ./gradlew :app:assembleDebug

      - name: Build Release
        run: ./gradlew :app:assembleRelease

      - name: Verify Release Isolation
        run: ./scripts/verify-release-isolation.sh

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: |
            **/build/reports/**
            app/build/outputs/apk/**
            .maestro/results/**

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: npm ci --prefix firebase-tests --no-audit --no-fund
      - run: npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-queda-s1 "npm --prefix firebase-tests test"
